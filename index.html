<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Index.css"/>
<style>
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<title>잡맵 - 지도로 찾는 채용공고</title>
</head>
<body>

<nav class="navbar">
  <div class="navbar-content">
    <div class="logo-container">
      <img src="Assets/MapIcon.png" alt="잡맵 로고" class="logo"/>
      <span class="logo-text">잡<span>맵</span></span>
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-link active">지도</a>
      <a href="jobs.html" class="nav-link">채용리스트</a>
    </div>

    <!-- 검색창: × 버튼 추가 -->
    <div class="search-container">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <input type="text" class="search-input" placeholder="회사명, 직무, 기술스택 검색"/>
      <button class="search-clear" id="search-clear" title="검색어 지우기">×</button>
    </div>

    <div class="nav-actions">
      <button class="btn-outline">로그인</button>
      <button class="btn-primary">이력서 등록</button>
    </div>
  </div>
</nav>

<div class="filter-bar">
  <div class="filter-scroll">
    <div class="filter-bar-inner">
      <button class="filter-chip active" data-filter="all" data-filter-group="category">전체</button>
      <button class="filter-chip" data-filter="IT·인터넷" data-filter-group="category">IT·인터넷</button>
      <button class="filter-chip" data-filter="핀테크" data-filter-group="category">핀테크</button>
      <button class="filter-chip" data-filter="이커머스" data-filter-group="category">이커머스</button>
      <div class="filter-divider"></div>
      <button class="filter-chip" data-filter="urgent" data-filter-group="special">🔥 상시채용</button>

      <div class="dropdown-wrap" id="distance-wrap">
        <button class="filter-chip dropdown-trigger" id="distance-trigger">
          거리 <span class="arrow">▾</span>
        </button>
        <div class="dropdown-menu distance-dropdown-menu" id="distance-menu">
          <div class="distance-slider-panel">
            <div class="distance-slider-header">
              <span class="distance-slider-title">반경 거리</span>
              <span class="distance-value-badge" id="distance-label">전체</span>
            </div>
            <div class="distance-slider-track-wrap">
              <input type="range" id="distance-slider" step="1" min="0" max="4" value="0">
              <div class="distance-tick-labels">
                <span>1.5km</span>
                <span>3km</span>
                <span>5km</span>
                <span>10km</span>
                <span>전체</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="dropdown-wrap">
        <button class="filter-chip dropdown-trigger" id="salary-trigger">
          연봉 <span class="arrow">▾</span>
        </button>
        <div class="dropdown-menu" id="salary-menu">
          <div class="dropdown-item" data-salary="0">전체</div>
          <div class="dropdown-item" data-salary="3000">3,000만원 이상</div>
          <div class="dropdown-item" data-salary="4000">4,000만원 이상</div>
          <div class="dropdown-item" data-salary="5000">5,000만원 이상</div>
          <div class="dropdown-item" data-salary="6000">6,000만원 이상</div>
          <div class="dropdown-item" data-salary="8000">8,000만원 이상</div>
        </div>
      </div>

      <div class="dropdown-wrap">
        <button class="filter-chip dropdown-trigger" id="type-trigger">
          고용형태 <span class="arrow">▾</span>
        </button>
        <div class="dropdown-menu" id="type-menu">
          <div class="dropdown-item" data-type="all">전체</div>
          <div class="dropdown-item" data-type="정규직">정규직</div>
          <div class="dropdown-item" data-type="계약직">계약직</div>
          <div class="dropdown-item" data-type="인턴">인턴</div>
          <div class="dropdown-item" data-type="프리랜서">프리랜서</div>
        </div>
      </div>

      <div class="dropdown-wrap">
        <button class="filter-chip dropdown-trigger" id="exp-trigger">
          경력 <span class="arrow">▾</span>
        </button>
        <div class="dropdown-menu" id="exp-menu">
          <div class="dropdown-item" data-exp="all">전체</div>
          <div class="dropdown-item" data-exp="신입">신입 (경력무관 포함)</div>
          <div class="dropdown-item" data-exp="1-3">1~3년차</div>
          <div class="dropdown-item" data-exp="3+">3년차 이상</div>
          <div class="dropdown-item" data-exp="5+">5년차 이상</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="main-content">
  <div class="map-container">
    <div class="map"></div>
    <div class="map-badge">주변 채용공고 <span>0개</span></div>
    <!-- 위치 확인 중 오버레이 -->
    <div id="map-loading" style="
        display: flex;
        position: absolute;
        inset: 0;
        z-index: 1000;
        background: rgba(255,255,255,0.75);
        backdrop-filter: blur(4px);
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        pointer-events: none;
    ">
        <div style="
            width: 36px; height: 36px;
            border: 3px solid #e5e7eb;
            border-top-color: #1a56db;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        "></div>
        <span style="font-size:13px;font-weight:600;color:#374151;">내 위치 확인 중...</span>
    </div>
  </div>
  <div class="card-list-container">
    <div class="list-header">
      <div class="list-header-top">
        <span class="list-title">근처 채용공고</span>
        <button class="list-sort">거리순 ▾</button>
      </div>
      <div class="list-count">총 <strong>0개</strong>의 채용공고</div>
    </div>
    <div class="card-list" id="card-list"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
